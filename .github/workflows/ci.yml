name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: API health smoke
        shell: bash
        run: |
          touch .env
          pnpm --filter @handelo/api exec tsx src/server.ts > /tmp/handelo-api.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/handelo-api.log
          exit 1
